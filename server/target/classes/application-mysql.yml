# ===================================================================
# mysql 环境：连接真实 MySQL 数据库
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 请提前创建数据库：CREATE DATABASE cmccpc DEFAULT CHARACTER SET utf8mb4;
# ===================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cmccpc}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: CmccpcHikariPool

  jpa:
    hibernate:
      # 生产环境建议改为 validate，配合 Flyway/Liquibase 管理表结构
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false

# 生产环境关闭 Swagger（如需开启请注释）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
