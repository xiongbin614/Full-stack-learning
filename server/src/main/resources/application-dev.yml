# 本地开发环境
logging:
  level:
    root: info
    com.demo: debug

# 本地开启 Knife4j；账号密码走环境变量 / .env
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
  basic:
    enable: true
    username: ${KNIFE4J_USERNAME}
    password: ${KNIFE4J_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
