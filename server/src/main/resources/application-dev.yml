# ===================================================================
# dev 环境：H2 内存数据库，开箱即用，无需安装任何外部服务
# 启动方式：mvn spring-boot:run
# H2 控制台：http://localhost:8080/api/h2-console  (JDBC URL: jdbc:h2:mem:cmccpc)
# ===================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cmccpc;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # 允许访问 H2 控制台
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

# 开发环境输出更详细的 SQL 日志
logging:
  level:
    org.hibernate.SQL: debug
