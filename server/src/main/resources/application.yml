# ===================================================================
# CMCCPC Web - Spring Boot 全家桶
# 默认使用 H2 内存数据库，开箱即用；生产环境请使用 dev/prod profile
# ===================================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: cmccpc-server
  profiles:
    # 默认 dev 使用 H2；切换到 mysql 时指定 --spring.profiles.active=mysql
    active: dev

  # ---------- 数据源（dev profile 覆盖为 H2；mysql profile 覆盖为 MySQL） ----------
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cmccpc;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      pool-name: CmccpcHikariPool

  # ---------- JPA ----------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---------- Redis（本地无 Redis 时 demo/redis 会失败；核心业务不依赖） ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ---------- Jackson ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# ---------- OpenAPI / Swagger ----------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: true
  group-configs:
    - group: default
      packages-to-scan: com.cmccpc.fullstack.controller

# ---------- 监控（默认只暴露健康检查，避免泄露环境信息） ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ---------- 日志 ----------
logging:
  level:
    root: info
    com.cmccpc.fullstack: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

# ---------- 业务自定义配置 ----------
cmccpc:
  # JWT 预留：启用时请用环境变量注入，勿使用仓库默认值
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: 86400
  cors:
    # 多个域名用逗号分隔；开发可用 *
    allowed-origins: "*"
